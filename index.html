<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12141A">
<title>근비대 트래커</title>
<link rel="manifest" href='data:application/json,{"name":"근비대 트래커","short_name":"트래커","start_url":"./","display":"standalone","background_color":"%2312141A","theme_color":"%2312141A"}'>
<style>
:root{
  --bg:#12141A; --surface:#1B1F27; --line:#2C323D;
  --chalk:#EDEAE3; --mute:#8A93A2;
  --red:#D6303C; --blue:#2B6CB8; --yellow:#E0AC1E; --green:#2E9E63; --white:#DFDCD4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--chalk);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(18px + env(safe-area-inset-top)) 16px 12px;}
.cyc{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font-size:22px;margin:2px 0 0;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.head-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.badge{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--surface);color:var(--mute);flex-shrink:0}
.bar{display:flex;align-items:center;gap:4px;margin-top:12px}
.bar .rod{height:2px;flex:1;background:var(--line)}
.plate{width:6px;border-radius:2px;background:var(--line);height:12px;transition:height .18s,background .18s}
.count{font-size:11px;text-align:center;margin-top:6px;color:var(--mute);font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daybtn{flex:0 0 auto;width:40px;height:40px;border-radius:99px;border:2px solid transparent;
  background:var(--surface);color:var(--mute);font-weight:700;font-size:14px}
.tabs{display:flex;gap:8px;padding:0 16px 8px}
.tab{font-size:13px;padding:6px 12px;border-radius:99px;border:0;background:transparent;color:var(--mute)}
.tab.on{background:var(--surface);color:var(--chalk)}
main{padding:0 16px}
.card{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.exhead h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.meta{font-size:11px;color:var(--mute);flex-shrink:0;font-variant-numeric:tabular-nums}
.tip{font-size:11px;color:var(--mute);margin:4px 0 0}
.setrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.idx{width:18px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
input.num{background:var(--bg);color:var(--chalk);border:1px solid var(--line);border-radius:6px;
  padding:9px 6px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums;
  width:72px;font-family:inherit}
input.num.reps{width:58px}
input.num:focus{outline:none;border-color:var(--mute)}
.x{font-size:11px;color:var(--mute)}
.check{margin-left:auto;width:42px;height:42px;border-radius:9px;background:var(--bg);
  border:1px solid var(--line);color:var(--mute);font-size:17px;font-weight:700}
.actions{display:flex;gap:8px;padding:4px 0 8px}
.primary{flex:1;padding:15px;border:0;border-radius:10px;font-weight:700;font-size:15px;font-family:inherit}
.ghost{padding:0 16px;border:0;border-radius:10px;background:var(--surface);color:var(--mute);font-size:13px;font-family:inherit}
.note{font-size:11px;color:var(--mute);line-height:1.6;padding-bottom:24px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.addbtn{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:var(--line);color:var(--chalk);font-weight:600;font-family:inherit}
.markrow{display:flex;justify-content:space-between;padding:12px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.markrow+.markrow{border-top:1px solid var(--line)}
.empty{font-size:13px;color:var(--mute);text-align:center;padding:24px 0}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <div class="cyc" id="cyc"></div>
      <h1 id="title"></h1>
    </div>
    <span class="badge" id="todayBadge" hidden>오늘</span>
  </div>
  <div class="bar" id="bar"></div>
  <div class="count" id="count"></div>
</header>

<div class="days" id="days"></div>
<div class="tabs">
  <button class="tab on" data-tab="train">운동</button>
  <button class="tab" data-tab="marks">측정 기록</button>
</div>
<main id="main"></main>

<script>
const C={red:'var(--red)',blue:'var(--blue)',yellow:'var(--yellow)',green:'var(--green)',white:'var(--white)'};
const DARK_TEXT={ 'var(--white)':1, 'var(--yellow)':1 };

const PROGRAM=[
 {day:1,title:'어깨 + 삼두',color:C.red,ex:[
   {n:'시티드 덤벨 숄더 프레스',s:4,r:'8~12',tip:'깊게 내려서 스트레치'},
   {n:'사이드 레터럴 레이즈',s:4,r:'12~15',tip:'반동 금지'},
   {n:'리버스 펙덱 / 케이블 리어 델트',s:3,r:'12~15'},
   {n:'클로즈그립 벤치프레스',s:4,r:'8~12',tip:'삼두 고중량 축'},
   {n:'오버헤드 케이블 익스텐션',s:3,r:'10~15',tip:'장두 스트레치'}]},
 {day:2,title:'등 + 이두',color:C.blue,ex:[
   {n:'랫풀다운 (와이드)',s:4,r:'8~12',tip:'팔꿈치로 당기기'},
   {n:'체스트 서포티드 로우',s:4,r:'8~12',tip:'허리 개입 차단'},
   {n:'스트레이트암 풀다운',s:3,r:'12~15',tip:'광배 고립'},
   {n:'인클라인 덤벨 컬',s:4,r:'10~12',tip:'장두 스트레치'},
   {n:'프리처 컬',s:4,r:'10~12',tip:'단두'}]},
 {day:3,title:'가슴 + 삼두 보조',color:C.yellow,ex:[
   {n:'인클라인 덤벨 프레스 (30°)',s:4,r:'8~12',tip:'윗가슴'},
   {n:'머신 체스트 프레스 / 스미스 플랫',s:4,r:'8~12'},
   {n:'케이블 플라이 (하→상)',s:4,r:'12~15',tip:'수축 정점 유지'},
   {n:'펙덱 플라이',s:3,r:'12~15',tip:'스트레치 끝까지'},
   {n:'트라이셉 푸시다운',s:3,r:'10~12'}]},
 {day:4,title:'팔 전용',color:C.white,ex:[
   {n:'라잉 트라이셉 익스텐션 (EZ바)',s:4,r:'8~12',tip:'바를 머리 뒤로'},
   {n:'오버헤드 케이블 익스텐션',s:3,r:'10~15',tip:'장두'},
   {n:'케이블 컬',s:3,r:'8~12',tip:'스트레치 강조'},
   {n:'스파이더 컬 / 프리처 컬',s:3,r:'10~15',tip:'수축 포지션'},
   {n:'해머 컬',s:3,r:'10~12',tip:'상완근'}]},
 {day:5,title:'하체 A — 대퇴사두',color:C.green,ex:[
   {n:'핵 스쿼트 / 스미스 스쿼트',s:4,r:'8~12',tip:'깊게'},
   {n:'레그 프레스 (발 아래)',s:4,r:'10~15',tip:'사두 타깃'},
   {n:'레그 익스텐션',s:4,r:'12~15',tip:'마지막 세트 실패까지'},
   {n:'라잉 레그 컬',s:3,r:'10~12'},
   {n:'스탠딩 카프 레이즈',s:3,r:'10~15',tip:'풀 스트레치'}]},
 {day:6,title:'가슴 + 등 + 이두 보조',color:C.blue,ex:[
   {n:'플랫 덤벨 프레스',s:4,r:'8~12'},
   {n:'시티드 케이블 로우 (내로우)',s:4,r:'8~12',tip:'등 중부'},
   {n:'인클라인 머신 프레스',s:3,r:'10~12'},
   {n:'랫풀다운 (뉴트럴/언더그립)',s:3,r:'10~12'},
   {n:'케이블 크로스오버',s:2,r:'12~15'},
   {n:'바이셉 컬',s:3,r:'10~12'}]},
 {day:7,title:'어깨',color:C.red,ex:[
   {n:'머신 숄더 프레스',s:4,r:'10~12'},
   {n:'케이블 레터럴 레이즈 (편측)',s:4,r:'12~15',tip:'초반 가동범위 텐션'},
   {n:'페이스풀',s:4,r:'12~15'},
   {n:'리어 델트 플라이',s:4,r:'12~15'}]},
 {day:8,title:'하체 B — 햄·둔근',color:C.green,ex:[
   {n:'루마니안 데드리프트',s:4,r:'8~12',tip:'햄 스트레치'},
   {n:'레그 프레스 (발 위) / 불가리안',s:4,r:'10~12'},
   {n:'시티드 레그 컬',s:4,r:'10~15',tip:'장두 스트레치'},
   {n:'레그 익스텐션',s:3,r:'12~15'},
   {n:'시티드 카프 레이즈',s:3,r:'12~15'}]}
];

const KEY='bb-tracker-v1';
let D={current:1,cycle:1,today:{},prev:{},marks:[]};
let day=1, tab='train';

try{ const raw=localStorage.getItem(KEY); if(raw) D=Object.assign(D,JSON.parse(raw)); day=D.current||1; }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){} };
const k=(ei,si)=>`d${day}-e${ei}-s${si}`;
const P=()=>PROGRAM[day-1];

function render(){
  const p=P();
  document.getElementById('cyc').textContent=`사이클 ${D.cycle}`;
  document.getElementById('title').innerHTML=`<span style="color:${p.color}">DAY ${p.day}</span> · ${p.title}`;
  document.getElementById('todayBadge').hidden = D.current!==day;

  const total=p.ex.reduce((a,e)=>a+e.s,0);
  let done=0;
  p.ex.forEach((e,ei)=>{for(let si=0;si<e.s;si++) if(D.today[k(ei,si)]&&D.today[k(ei,si)].done) done++;});
  const lit=Math.round((total?done/total:0)*8);
  document.getElementById('bar').innerHTML='<div class="rod"></div>'+
    Array.from({length:8},(_,i)=>`<div class="plate" style="${i<lit?`height:26px;background:${p.color}`:''}"></div>`).join('')+
    '<div class="rod"></div>';
  document.getElementById('count').textContent=`${done} / ${total} 세트`;

  document.getElementById('days').innerHTML=PROGRAM.map(q=>{
    const on=q.day===day;
    return `<button class="daybtn" data-day="${q.day}" style="${on?`background:${q.color};color:${DARK_TEXT[q.color]?'#12141A':'#fff'}`:''};${D.current===q.day&&!on?`border-color:${q.color}`:''}">${q.day}</button>`;
  }).join('');

  document.getElementById('main').innerHTML = tab==='train'?trainView(p):marksView();
}

function trainView(p){
  const rows=p.ex.map((e,ei)=>{
    const sets=Array.from({length:e.s},(_,si)=>{
      const key=k(ei,si), cur=D.today[key]||{}, old=D.prev[key]||{};
      return `<div class="setrow">
        <span class="idx">${si+1}</span>
        <input class="num" inputmode="decimal" data-f="w" data-ei="${ei}" data-si="${si}" value="${cur.w||''}" placeholder="${old.w||'kg'}">
        <span class="x">×</span>
        <input class="num reps" inputmode="numeric" data-f="r" data-ei="${ei}" data-si="${si}" value="${cur.r||''}" placeholder="${old.r||'회'}">
        <button class="check" data-chk="${ei},${si}" style="${cur.done?`background:${p.color};border-color:${p.color};color:${DARK_TEXT[p.color]?'#12141A':'#fff'}`:''}">✓</button>
      </div>`;}).join('');
    return `<div class="card">
      <div class="exhead"><h3>${e.n}</h3><span class="meta">${e.s} × ${e.r}</span></div>
      ${e.tip?`<p class="tip">${e.tip}</p>`:''}
      <div>${sets}</div></div>`;
  }).join('');

  return rows+`<div class="actions">
      <button class="primary" id="finish" style="background:${p.color};color:${DARK_TEXT[p.color]?'#12141A':'#fff'}">세션 완료 · 다음 날로</button>
      <button class="ghost" id="reset">초기화</button>
    </div>
    <p class="note">세션 완료를 누르면 오늘 기록이 "지난 기록"으로 넘어가고 다음 날로 이동해. 입력칸의 회색 숫자가 지난 사이클 기록이야. 강도는 1~3 RIR, 반복수 상단에 닿으면 중량을 올려.</p>`;
}

function marksView(){
  const list=(D.marks||[]).length? D.marks.map(m=>`<div class="markrow"><span style="color:var(--mute)">${m.d}</span>
     <span>${m.arm?`팔 ${m.arm}　`:''}${m.sh?`어깨 ${m.sh}　`:''}${m.bw?`${m.bw}kg`:''}</span></div>`).join('')
   : `<p class="empty">아직 측정 기록이 없어. 첫 기록이 기준선이 돼.</p>`;
  return `<div class="card">
     <p class="tip" style="margin-bottom:10px">4~6주마다 같은 시간대, 논펌프 상태로 재.</p>
     <div class="grid3">
       <input class="num" id="m-arm" inputmode="decimal" placeholder="팔 cm" style="width:100%">
       <input class="num" id="m-sh" inputmode="decimal" placeholder="어깨 cm" style="width:100%">
       <input class="num" id="m-bw" inputmode="decimal" placeholder="체중 kg" style="width:100%">
     </div>
     <button class="addbtn" id="addmark">기록 추가</button>
   </div>
   <div class="card" style="padding:0;overflow:hidden">${list}</div>`;
}

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(t.dataset.day){ day=+t.dataset.day; render(); }
  else if(t.dataset.chk){ const [ei,si]=t.dataset.chk.split(',').map(Number);
    const key=k(ei,si); D.today[key]=Object.assign({},D.today[key],{done:!(D.today[key]||{}).done}); save(); render(); }
  else if(t.dataset.tab){ tab=t.dataset.tab;
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===t)); render(); }
  else if(t.id==='finish'){
    Object.keys(D.today).forEach(key=>{ if(key.startsWith(`d${day}-`)){
      const v=D.today[key]; if(v&&(v.w||v.r)) D.prev[key]={w:v.w,r:v.r}; delete D.today[key]; }});
    const next = day===8?1:day+1;
    if(day===8) D.cycle++;
    D.current=next; day=next; save(); render(); window.scrollTo(0,0);
  }
  else if(t.id==='reset'){
    Object.keys(D.today).forEach(key=>key.startsWith(`d${day}-`)&&delete D.today[key]); save(); render();
  }
  else if(t.id==='addmark'){
    const arm=document.getElementById('m-arm').value, sh=document.getElementById('m-sh').value, bw=document.getElementById('m-bw').value;
    if(!arm&&!sh&&!bw) return;
    D.marks=[{d:new Date().toISOString().slice(0,10),arm,sh,bw}].concat(D.marks||[]);
    save(); render();
  }
});

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(!t.dataset.f) return;
  const key=k(+t.dataset.ei,+t.dataset.si);
  D.today[key]=Object.assign({},D.today[key],{[t.dataset.f]:t.value});
  save();
});

render();
</script>
</body>
</html>
